name: Docs Pages

# 构建 VitePress 文档站并发布到 GitHub Pages。
# 触发：main 上 docs/、docs-site/ 或同步脚本变更；也支持手动运行。
# VitePress 的 base 由 docs-site/.vitepress/config.mts 决定，本工作流不重复设置。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'scripts/sync-docs.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 发布，不取消进行中的发布（避免半途中断）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建并发布文档站
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node（读取 .nvmrc）
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建文档站
        run: npm run docs:build

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/.vitepress/dist

      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
