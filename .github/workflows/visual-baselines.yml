name: Visual Baselines

# 手动运行：在 Linux 上生成视觉回归基线（*-linux.png），产物随 artifact 下载后提交。
# 日常 CI 只校验已提交的基线（见 ci.yml 的 build 作业）。
on:
  workflow_dispatch:

jobs:
  baselines:
    name: 生成 Linux 视觉基线
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装系统依赖（Electron 运行库）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2 xvfb libxss1 libxtst6 libatspi2.0-0 fonts-noto-cjk || true

      - name: 安装依赖
        uses: ./.github/actions/setup
        with:
          skip-browsers: '1'

      - name: 构建渲染层与主进程产物
        run: npm run electron:build

      - name: 生成基线（--update-snapshots）
        run: xvfb-run -a npm run test:e2e:visual -- --update-snapshots
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: 上传基线产物
        uses: actions/upload-artifact@v4
        with:
          name: visual-linux
          path: e2e/visual.spec.ts-snapshots/
          if-no-files-found: error
