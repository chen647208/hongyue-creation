name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新提交取消旧的进行中任务：不浪费 CI 分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 变更分类：纯文档改动跳过重构建（Electron 构建是分钟级开销）
  changes:
    name: 变更分类
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: 检出代码（含历史，供 diff）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 判断是否含非文档改动
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff --name-only "${{ github.event.before }}...${{ github.sha }}")
          else
            # 首次推送/手动触发：无法判定范围，按代码处理
            changed="code"
          fi
          if printf '%s\n' "$changed" | grep -qEv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: 规范 · 类型 · 测试（含覆盖率锁线）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装依赖
        uses: ./.github/actions/setup

      - name: 运行期依赖安全审计（高危/严重即失败）
        run: npm audit --omit=dev --audit-level=high

      - name: 全部门禁（与本地同一条 npm run verify 链）
        run: npm run verify

  build:
    name: 构建校验（Electron）
    runs-on: ubuntu-latest
    needs: [verify, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装系统依赖（Electron 运行库，供构建校验）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2 xvfb libxss1 libxtst6 libatspi2.0-0 fonts-noto-cjk || true

      - name: 安装依赖
        uses: ./.github/actions/setup
        with:
          # E2E 只用仓库自带 electron，不下 Playwright 浏览器
          skip-browsers: '1'

      - name: 构建渲染层与主进程产物
        run: npm run electron:build

      - name: 校验图标资源
        run: npm run check:icons

      - name: E2E 启动冒烟（xvfb 无头，数据目录隔离）
        run: xvfb-run -a npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: 视觉回归（Linux 基线，见 visual-baselines.yml 生成）
        run: xvfb-run -a npm run test:e2e:visual
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: 打包 Linux 目录产物（供打包冒烟）
        run: npx electron-builder --linux dir --publish never

      - name: 打包冒烟（asar 下启动 + 沙箱执行）
        run: |
          EXE=$(find build/release/linux-unpacked -maxdepth 1 -type f -executable ! -name 'chrome-sandbox' ! -name '*.so*' ! -name 'chrome_crashpad_handler' | head -n1)
          echo "HONGYUE_PACKAGED_EXE=$EXE"
          HONGYUE_PACKAGED_EXE="$EXE" xvfb-run -a npm run test:e2e:packaged
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

  # 平台打包校验：linux 之外的 win/mac 产物首次在 main 推送时构建（PR 不跑，省分钟数）。
  package-matrix:
    name: 打包校验（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    needs: [verify, changes]
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装依赖
        uses: ./.github/actions/setup

      - name: 构建渲染层与主进程产物
        run: npm run electron:build

      - name: 打包目录产物（不签名）
        run: npx electron-builder ${{ matrix.target }} dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
