<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="红月创作">
  <defs>
    <radialGradient id="hy-logo-moon" cx="40%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#d64060"/>
      <stop offset="70%" stop-color="#b3123c"/>
      <stop offset="100%" stop-color="#8a0d2e"/>
    </radialGradient>
  </defs>

  <!-- 红月从摊开的书卷后升起 -->
  <circle cx="128" cy="100" r="68" fill="url(#hy-logo-moon)"/>

  <!-- 左页 -->
  <path d="M26 190Q78 166 124 188L124 230Q78 210 26 232Z"
        fill="#f7f4ed" stroke="#b8863f" stroke-width="10" stroke-linejoin="round"/>
  <!-- 右页 -->
  <path d="M230 190Q178 166 132 188L132 230Q178 210 230 232Z"
        fill="#f7f4ed" stroke="#b8863f" stroke-width="10" stroke-linejoin="round"/>

  <!-- 书脊 -->
  <path d="M124 188L124 230M124 188L132 188" fill="none" stroke="#b8863f" stroke-width="8"/>

  <!-- 页面上的一行字 -->
  <g stroke="#b8863f" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="44" y1="204" x2="96" y2="194"/>
    <line x1="50" y1="218" x2="94" y2="209"/>
    <line x1="212" y1="204" x2="160" y2="194"/>
    <line x1="206" y1="218" x2="162" y2="209"/>
  </g>
</svg>
