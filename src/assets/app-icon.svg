  <!-- 书脊 -->
  <path d="M496 752L496 920M496 752L528 752" fill="none" stroke="#c79a5b" stroke-width="32"/>

  <!-- 页面上的一行字 -->
  <g stroke="#c79a5b" stroke-width="12" stroke-linecap="round" opacity="0.6">
    <line x1="176" y1="816" x2="384" y2="776"/>
    <line x1="200" y1="872" x2="376" y2="836"/>
    <line x1="848" y1="816" x2="640" y2="776"/>
    <line x1="824" y1="872" x2="648" y2="836"/>
  </g>
</svg>
