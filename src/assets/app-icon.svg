<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="红月创作">
  <defs>
    <radialGradient id="hy-icon-moon" cx="40%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#e55472"/>
      <stop offset="70%" stop-color="#c01e47"/>
      <stop offset="100%" stop-color="#8a0d2e"/>
    </radialGradient>
  </defs>

  <!-- 圆角方底 -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="#17121b"/>

  <!-- 红月从摊开的书卷后升起 -->
  <circle cx="512" cy="400" r="272" fill="url(#hy-icon-moon)"/>

  <!-- 左页 -->
  <path d="M104 760Q312 664 496 752L496 920Q312 840 104 928Z"
